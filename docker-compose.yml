version: "3.9"

services:
  torohamadb:
    image: mysql:8.0
    container_name: torohamadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: trohamadb
      MYSQL_USER: trohamadb
      MYSQL_PASSWORD: trohamadb
    ports:
      - "43316:3306"
    volumes:
      - torohamadb:/var/lib/mysql:delegated
      - ./localdb/my-docker.cnf:/etc/my.cnf:delegated
  torohamasyncdb:
    image: mysql:8.0
    container_name: torohamasyncdb
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: trohamasyncdb
      MYSQL_USER: trohamasyncdb
      MYSQL_PASSWORD: trohamasyncdb
    ports:
      - "43317:3306"
    volumes:
      - torohamasyncdb:/var/lib/mysql:delegated
      - ./localdb/my-docker.cnf:/etc/my.cnf:delegated

volumes:
  torohamadb:
  torohamasyncdb:
