name: scripts-test

# .github/scripts/ 配下のスクリプトの単体テスト (node:test) を実行する。
# 追加依存なしで node --test だけで動く。

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts-test.yml'
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/scripts-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run script unit tests
        run: node --test .github/scripts/*.test.js
